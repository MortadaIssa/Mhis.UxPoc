<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHIS - Mental Health Information System</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Vendored locally (js/vendor/lucide.min.js) instead of loaded from a CDN so the
         icon set doesn't depend on the demo machine's network/proxy reaching an external
         host, and doesn't silently break if the "@latest" CDN build ever changes. -->
    <script src="js/vendor/lucide.min.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen" hidden>
        <div class="login-panel">
            <div class="login-brand">
                <div class="login-logo">MHIS</div>
                <p class="login-subtitle">Mental Health Information System</p>
            </div>
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-field">
                    <label for="loginEmail">Email <span class="required">*</span></label>
                    <input type="email" id="loginEmail" autocomplete="username" data-required="true" />
                    <div class="field-error" id="loginEmail-error"></div>
                </div>
                <div class="form-field">
                    <label for="loginPassword">Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" autocomplete="current-password" data-required="true" />
                    <div class="field-error" id="loginPassword-error"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <button type="button" class="btn btn-link btn-block" id="explorePublicBtn">Explore Mental Health Services</button>
        </div>
        <aside class="demo-panel">
            <div class="demo-panel-header">
                <span class="demo-chip">Demo</span>
                <h2>Demo accounts</h2>
                <p>Select an account to open the matching MHIS experience.</p>
            </div>
            <div class="demo-account-list" id="demoAccountList"></div>
            <button type="button" class="btn btn-link" id="resetDemoBtn">Reset demo data</button>
        </aside>
    </div>

    <!-- Top Bar -->
    <div class="top-bar" id="topBar" hidden>
        <div class="top-bar-content">
            <div class="top-bar-left">
                <div class="mhis-logo">MHIS</div>
            </div>
            <div class="top-bar-right">
                <button class="notification-btn" id="notificationBell" title="Notifications">
                    <svg class="icon icon-notification" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="notification-badge" id="notificationBadge" style="display: none;">3</span>
                </button>
                <div class="account-menu-wrapper">
                    <button class="account-btn" id="accountBtn">
                        <svg class="icon icon-account" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span class="org-name" id="topBarOrgName">Community Health NGO</span>
                        <svg class="icon icon-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="account-dropdown" id="accountDropdown" style="display: none;">
                        <a href="#" class="dropdown-item" id="changePasswordBtn">Change Password</a>
                        <a href="#" class="dropdown-item" id="logoutBtn">Log Out</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Dropdown Modal -->
    <div class="notification-modal" id="notificationModal" style="display: none;">
        <div class="notification-header">
            <h3>Notifications</h3>
            <button class="close-btn" id="closeNotifications">&times;</button>
        </div>
        <div class="notification-list" id="notificationList">
            <!-- Notifications will be populated here -->
        </div>
        <div class="notification-footer">
            <button class="mark-read-btn" id="markAllRead">Mark all as read</button>
        </div>
    </div>

    <!-- Notification Detail Modal -->
    <div class="modal-overlay" id="notificationDetailOverlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- Reusable Form / Detail Modal -->
    <div class="modal-overlay" id="formModalOverlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="formModalTitle"></h3>
                <button class="close-btn" id="closeFormModal">&times;</button>
            </div>
            <div class="modal-body" id="formModalBody"></div>
            <div class="modal-footer" id="formModalFooter"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <div class="main-container" id="appShell" hidden>
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <!-- Navigation is rendered by js/nav.js based on the signed-in demo account -->
            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div id="page-container">
                <!-- Pages will be rendered here -->
            </div>
        </main>
    </div>

    <script src="js/demo-session.js"></script>
    <script src="js/data.js"></script>
    <script src="js/shared-ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/core.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/resources.js"></script>
    <script src="js/pages/calendar.js"></script>
    <script src="js/pages/dashboards.js"></script>
    <script src="js/pages/organization.js"></script>
    <script src="js/pages/facilities.js"></script>
    <script src="js/pages/providers.js"></script>
    <script src="js/pages/activities.js"></script>
    <script src="js/pages/registration.js"></script>
    <script src="js/pages/admin.js"></script>
</body>
</html>
